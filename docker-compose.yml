services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - claims-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrationsOnStartup: "true"
      Tenant__DefaultOrganisationId: "00000000-0000-0000-0000-000000000001"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClaimsModule;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
      StorageProvider: LocalFileSystem
      LocalStorage__BasePath: /app/uploads
      Jwt__SecretKey: "ClaimsModuleAssessmentSecretKey2026MustBe32CharsMin!"
      Jwt__Issuer: ClaimsModule
      Jwt__Audience: ClaimsModule
    ports:
      - "5260:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - claims-uploads:/app/uploads

volumes:
  claims-sql-data:
  claims-uploads:
